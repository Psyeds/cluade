name: Build Reels Guard APK

on:
  push:
    branches: ['**']
    paths: ['ReelsGuard/**', '.github/workflows/build-reels-guard.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle -p ReelsGuard :app:assembleDebug --no-daemon
      - name: Publish APK to a release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ReelsGuard/app/build/outputs/apk/debug/app-debug.apk ReelsGuard.apk
          gh release delete reels-guard-latest --yes --cleanup-tag || true
          gh release create reels-guard-latest ReelsGuard.apk --title "Reels Guard (latest)" --notes "Download ReelsGuard.apk and install it." --target "${{ github.sha }}"
