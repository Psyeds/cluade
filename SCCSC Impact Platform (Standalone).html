document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9451c018-ef06-4ada-b65c-0cc48f46d5a0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}\nbody{margin:0;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\ninput[type=range]{-webkit-appearance:none;appearance:none}\ninput[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#b3282d;cursor:pointer;box-shadow:0 2px 6px rgba(179,40,45,.4)}\n@keyframes armSwingL{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}\n@keyframes armSwingR{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}\n@keyframes dustPuffSlow{0%{opacity:0;transform:translate(0,0) scale(.5)}45%{opacity:.35}100%{opacity:0;transform:translate(0,-24px) scale(1.2)}}\n@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}\n@keyframes needleIdle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"{{ pageStyle }}\">\n\n  <div style=\"{{ headerStyle }}\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:12px;min-width:0\">\n        <div style=\"{{ logoBoxStyle }}\">\n          <span style=\"{{ logoGlyphStyle }}\">中<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"min-width:0\">\n          <p style=\"{{ titleStyle }}\">{{ headerTitle }}<\u002Fp>\n          <p style=\"{{ subtitleStyle }}\">{{ headerSubtitle }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <div style=\"{{ dialTrackStyle }}\">\n          <div style=\"{{ dialThumbStyle }}\"><\u002Fdiv>\n          <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ item.select }}\" style=\"{{ item.btnStyle }}\">\n              <span style=\"font-size:14px\">{{ item.glyph }}<\u002Fspan>{{ item.label }}\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goAdmin }}\" style=\"{{ adminLinkStyle }}\">◈ Admin · Soon<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 24px 96px\">\n\n    <sc-if value=\"{{ isStudent }}\" hint-placeholder-val=\"{{ true }}\">\n      <sc-if value=\"{{ checkinSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding-top:120px;text-align:center;animation:riseIn .5s ease\">\n          <div style=\"font-size:56px;margin-bottom:16px\">🎉<\u002Fdiv>\n          <h1 style=\"font-family:Fraunces,serif;font-size:32px;font-weight:600;color:#2b2320;margin:0 0 12px\">Thank you!<\u002Fh1>\n          <p style=\"font-family:'Nunito Sans',sans-serif;color:#6b5f58;font-size:15px;max-width:420px;margin:0 auto 28px\">Your check-in helps the Center make programs even better. See you tomorrow!<\u002Fp>\n          <button sc-camel-on-click=\"{{ resetCheckin }}\" style=\"font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,#b3282d,#8e1f23);border:none;border-radius:14px;padding:14px 28px;cursor:pointer\">Check in again<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ checkinNotSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding-top:40px;animation:riseIn .5s ease\">\n        <p style=\"font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#d4a03c;margin:0 0 8px\">Daily Check-In · 每日签到<\u002Fp>\n        <h1 style=\"font-family:Fraunces,serif;font-size:34px;font-weight:600;color:#2b2320;margin:0 0 10px;line-height:1.15\">How was <span style=\"color:#b3282d\">your day<\u002Fspan> at the Center?<\u002Fh1>\n        <p style=\"font-family:'Nunito Sans',sans-serif;color:#6b5f58;font-size:14px;margin:0 0 32px\">It only takes a minute — your answers are anonymous and help our programs grow.<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:24px\">\n            <section style=\"{{ cardStyle }}\">\n              <h3 style=\"{{ cardHeadingStyle }}\">How are you feeling?<\u002Fh3>\n              <div style=\"display:flex;gap:8px\">\n                <sc-for list=\"{{ moods }}\" as=\"m\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ m.select }}\" style=\"{{ m.btnStyle }}\">\n                    <span style=\"font-size:24px\">{{ m.emoji }}<\u002Fspan>\n                    <span style=\"{{ m.labelStyle }}\">{{ m.label }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"{{ cardStyle }}\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px\">\n                <h3 style=\"{{ cardHeadingStyle }}\">Energy in today's activity<\u002Fh3>\n                <span style=\"font-family:Fraunces,serif;font-weight:700;font-size:22px;color:#b3282d\">{{ energy }}/5<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"1\" max=\"5\" value=\"{{ energy }}\" sc-camel-on-change=\"{{ onEnergyChange }}\" style=\"width:100%;height:6px;border-radius:3px;background:{{ energyTrackBg }}\">\n              <div style=\"display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#6b5f58;margin-top:8px\">\n                <span>Sleepy 😴<\u002Fspan><span>Fired up ⚡<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"{{ cardStyle }}\">\n              <h3 style=\"{{ cardHeadingStyle }}\">Which program were you in today?<\u002Fh3>\n              <sc-raw-select value=\"{{ program }}\" sc-camel-on-change=\"{{ onProgramChange }}\" style=\"width:100%;border-radius:12px;padding:12px 16px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:14px;background:#F8F2E8;border:1.5px solid #E8DCC8;color:#2b2320;cursor:pointer\">\n                <sc-for list=\"{{ programOptions }}\" as=\"p\" hint-placeholder-count=\"6\">\n                  <option>{{ p }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:24px\">\n            <section style=\"{{ cardStyle }}\">\n              <h3 style=\"{{ cardHeadingStyle }}\">What did you get out of today?<\u002Fh3>\n              <p style=\"font-family:'Nunito Sans',sans-serif;color:#6b5f58;font-size:12px;margin:0 0 14px\">Pick as many as you like<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ tags }}\" as=\"tg\" hint-placeholder-count=\"7\">\n                  <button sc-camel-on-click=\"{{ tg.toggle }}\" style=\"{{ tg.btnStyle }}\">{{ tg.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"{{ cardStyle }}\">\n              <h3 style=\"{{ cardHeadingStyle }}\">Did you feel welcome here?<\u002Fh3>\n              <div style=\"display:flex;gap:10px;margin-top:10px\">\n                <button sc-camel-on-click=\"{{ setWelcomeYes }}\" style=\"{{ welcomeYesStyle }}\">Yes 😊<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setWelcomeNo }}\" style=\"{{ welcomeNoStyle }}\">Not really<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"{{ cardStyle }}\">\n              <h3 style=\"{{ cardHeadingStyle }}\">Want extra homework help?<\u002Fh3>\n              <div style=\"display:flex;gap:10px;margin-top:10px\">\n                <button sc-camel-on-click=\"{{ setHomeworkYes }}\" style=\"{{ homeworkYesStyle }}\">Yes please<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setHomeworkNo }}\" style=\"{{ homeworkNoStyle }}\">I'm good<\u002Fbutton>\n              <\u002Fdiv>\n              <p style=\"font-family:'Nunito Sans',sans-serif;font-size:11px;color:#6b5f58;margin:10px 0 0\">A team leader will check in with your group<\u002Fp>\n            <\u002Fsection>\n            <button sc-camel-on-click=\"{{ submitCheckin }}\" style=\"font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#b3282d,#8e1f23);border:none;border-radius:14px;padding:16px;cursor:pointer;box-shadow:0 10px 24px rgba(179,40,45,.25)\">Submit my check-in ✓<\u002Fbutton>\n            <p style=\"font-family:'Nunito Sans',sans-serif;font-size:11px;text-align:center;color:#6b5f58;margin:0\">🔒 Anonymous by default — no answers are ever shown with your name publicly<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTeacher }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding-top:40px;animation:riseIn .5s ease\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px\">\n          <div>\n            <p style=\"font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#d4a03c;margin:0 0 8px\">Team Leader Console<\u002Fp>\n            <h1 style=\"font-family:Fraunces,serif;font-size:32px;font-weight:600;color:#2b2320;margin:0\">Good afternoon, <span style=\"color:#b3282d\">Ms. Wong<\u002Fspan><\u002Fh1>\n            <p style=\"font-family:'Nunito Sans',sans-serif;color:#6b5f58;font-size:13px;margin:6px 0 0\">Room 104 · Your Groups Today<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"text-align:right\">\n            <p style=\"font-family:Fraunces,serif;font-weight:700;font-size:20px;color:#2b2320;margin:0\">{{ presentCount }} / {{ totalCount }}<\u002Fp>\n            <p style=\"font-family:'Nunito Sans',sans-serif;font-size:12px;color:#6b5f58;margin:2px 0 0\">present today<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start\">\n          <section style=\"{{ cardStyle }}\">\n            <h3 style=\"{{ cardHeadingStyle }}\">Class Roster<\u002Fh3>\n            <p style=\"font-family:'Nunito Sans',sans-serif;font-size:12px;color:#6b5f58;margin:0 0 16px\">Tap a student to mark present / absent<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ roster }}\" as=\"stu\" hint-placeholder-count=\"8\">\n                <button sc-camel-on-click=\"{{ stu.toggle }}\" style=\"{{ stu.rowStyle }}\">\n                  <span style=\"{{ stu.dotStyle }}\"><\u002Fspan>\n                  <span style=\"font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:14px;color:#2b2320\">{{ stu.name }}<\u002Fspan>\n                  <span style=\"{{ stu.statusStyle }}\">{{ stu.statusLabel }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ submitAttendance }}\" style=\"margin-top:20px;width:100%;font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,#b3282d,#8e1f23);border:none;border-radius:14px;padding:14px;cursor:pointer\">{{ attendanceSubmitLabel }}<\u002Fbutton>\n            <p style=\"font-family:'Nunito Sans',sans-serif;font-size:11px;color:#6b5f58;text-align:center;margin:10px 0 0\">Attendance auto-saves · syncs to the Center's records at 6:00 PM<\u002Fp>\n          <\u002Fsection>\n\n          <section style=\"{{ cardStyle }}\">\n            <h3 style=\"{{ cardHeadingStyle }}\">Today's Check-In Responses<\u002Fh3>\n            <p style=\"font-family:'Nunito Sans',sans-serif;font-size:12px;color:#6b5f58;margin:0 0 14px\">First names visible to staff only<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ sampleResponses }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div style=\"background:#F8F2E8;border-radius:12px;padding:10px 14px;font-family:'Nunito Sans',sans-serif;font-size:13px;color:#2b2320\">\n                  <span style=\"font-weight:800\">{{ r.name }}<\u002Fspan> — {{ r.emoji }} {{ r.note }}\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button style=\"margin-top:16px;width:100%;font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:13px;color:#6b5f58;background:#F8F2E8;border:1.5px solid #E8DCC8;border-radius:12px;padding:12px;cursor:pointer\">⬇ Export CSV<\u002Fbutton>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding-top:40px;animation:riseIn .5s ease\">\n        <div style=\"margin-bottom:20px\">\n          <p style=\"font-family:'Space Grotesk',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.24em;color:#c8a96a;margin:0 0 12px\">◈ Admin Dashboard<\u002Fp>\n          <h1 style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;color:#e8e6e1;margin:0 0 10px;line-height:1.2\">Mission control is under construction.<\u002Fh1>\n          <p style=\"font-family:Outfit,sans-serif;color:#8b8f98;font-size:14px;margin:0;max-width:560px\">Live widgets connect the moment the Supabase pipeline goes live. Everything below is real UI, sitting ready for real data.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:linear-gradient(90deg,transparent,#c8a96a55,transparent);margin-bottom:28px\"><\u002Fdiv>\n\n        <p style=\"font-family:Outfit,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:#8b8f98;margin:0 0 14px\">Instrumentation · idle<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px\">\n          <sc-for list=\"{{ gauges }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"{{ luxCardStyle }};text-align:center\">\n              <svg sc-camel-view-box=\"0 0 120 76\" style=\"width:100%;max-width:140px;margin:0 auto;display:block\">\n                <path d=\"M10 70 A50 50 0 0 1 110 70\" fill=\"none\" stroke=\"#262a32\" stroke-width=\"8\"><\u002Fpath>\n                <line x1=\"60\" y1=\"24\" x2=\"60\" y2=\"32\" stroke=\"#3a3f4a\" stroke-width=\"3\"><\u002Fline>\n                <line x1=\"18\" y1=\"70\" x2=\"26\" y2=\"70\" stroke=\"#3a3f4a\" stroke-width=\"3\"><\u002Fline>\n                <line x1=\"102\" y1=\"70\" x2=\"94\" y2=\"70\" stroke=\"#3a3f4a\" stroke-width=\"3\"><\u002Fline>\n                <g style=\"{{ g.needleStyle }}\">\n                  <line x1=\"60\" y1=\"70\" x2=\"60\" y2=\"28\" stroke=\"#c8a96a\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fline>\n                <\u002Fg>\n                <circle cx=\"60\" cy=\"70\" r=\"4.5\" fill=\"#c8a96a\"><\u002Fcircle>\n              <\u002Fsvg>\n              <p style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:13px;color:#e8e6e1;margin:8px 0 2px\">{{ g.label }}<\u002Fp>\n              <p style=\"font-family:Outfit,sans-serif;font-size:11px;color:#5e636e;margin:0\">awaiting data<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <p style=\"font-family:Outfit,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:#8b8f98;margin:0 0 14px\">Workspace<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px\">\n          <sc-for list=\"{{ emptyCards }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"border:1.5px dashed #2c313a;border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:150px\">\n              <span style=\"align-self:flex-start;font-family:Outfit,sans-serif;font-size:10px;color:#8b8f98;background:#1A1D23;border:1px solid #262a32;border-radius:999px;padding:3px 10px\">🔧 {{ c.tag }}<\u002Fspan>\n              <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center\">\n                <span style=\"font-family:Outfit,sans-serif;font-size:13px;color:#5e636e\">{{ c.title }}<\u002Fspan>\n                <button style=\"font-family:Outfit,sans-serif;font-weight:600;font-size:12px;color:#c8a96a;background:none;border:1px solid #3a3222;border-radius:999px;padding:6px 16px;cursor:pointer\">+ Add Widget<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"{{ luxCardStyle }};display:flex;align-items:center;gap:24px\">\n          <div style=\"position:relative;width:120px;height:76px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;gap:14px\">\n            <div style=\"position:absolute;left:30%;top:10%;width:8px;height:8px;border-radius:50%;background:#8b8f98;animation:dustPuffSlow 2.4s ease-in-out infinite\"><\u002Fdiv>\n            <div style=\"position:absolute;left:60%;top:4%;width:10px;height:10px;border-radius:50%;background:#8b8f98;animation:dustPuffSlow 2.8s ease-in-out infinite;animation-delay:.6s\"><\u002Fdiv>\n            <svg width=\"40\" height=\"60\" sc-camel-view-box=\"0 0 72 96\" style=\"animation:bob 2.4s ease-in-out infinite\">\n              <circle cx=\"36\" cy=\"20\" r=\"16\" fill=\"#b3282d\"><\u002Fcircle>\n              <rect x=\"20\" y=\"38\" width=\"32\" height=\"38\" rx=\"10\" fill=\"#d4a03c\"><\u002Frect>\n              <rect x=\"9\" y=\"42\" width=\"10\" height=\"30\" rx=\"5\" fill=\"#b3282d\" style=\"transform-origin:19px 44px;animation:armSwingL 1.1s ease-in-out infinite\"><\u002Frect>\n              <rect x=\"53\" y=\"42\" width=\"10\" height=\"30\" rx=\"5\" fill=\"#b3282d\" style=\"transform-origin:53px 44px;animation:armSwingR 1.1s ease-in-out infinite\"><\u002Frect>\n              <rect x=\"24\" y=\"76\" width=\"10\" height=\"16\" rx=\"4\" fill=\"#1A1D23\"><\u002Frect>\n              <rect x=\"38\" y=\"76\" width=\"10\" height=\"16\" rx=\"4\" fill=\"#1A1D23\"><\u002Frect>\n            <\u002Fsvg>\n            <svg width=\"40\" height=\"60\" sc-camel-view-box=\"0 0 72 96\" style=\"animation:bob 2.6s ease-in-out infinite;animation-delay:.3s\">\n              <circle cx=\"36\" cy=\"20\" r=\"16\" fill=\"#4a7c59\"><\u002Fcircle>\n              <rect x=\"20\" y=\"38\" width=\"32\" height=\"38\" rx=\"10\" fill=\"#6b7280\"><\u002Frect>\n              <rect x=\"9\" y=\"42\" width=\"10\" height=\"30\" rx=\"5\" fill=\"#4a7c59\" style=\"transform-origin:19px 44px;animation:armSwingR 1.3s ease-in-out infinite\"><\u002Frect>\n              <rect x=\"53\" y=\"42\" width=\"10\" height=\"30\" rx=\"5\" fill=\"#4a7c59\" style=\"transform-origin:53px 44px;animation:armSwingL 1.3s ease-in-out infinite\"><\u002Frect>\n              <rect x=\"24\" y=\"76\" width=\"10\" height=\"16\" rx=\"4\" fill=\"#1A1D23\"><\u002Frect>\n              <rect x=\"38\" y=\"76\" width=\"10\" height=\"16\" rx=\"4\" fill=\"#1A1D23\"><\u002Frect>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div>\n            <p style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;color:#e8e6e1;margin:0 0 4px\">Built with care by Syed &amp; Oliver<\u002Fp>\n            <p style=\"font-family:Outfit,sans-serif;font-size:12px;color:#8b8f98;margin:0\">This workspace is a placeholder — swap it for live widgets once the Supabase pipeline is connected.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding-top:56px;animation:riseIn .5s ease\">\n        <div style=\"text-align:center;margin-bottom:24px\">\n          <p style=\"font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#d4a03c;margin:0 0 8px\">Behind the Platform<\u002Fp>\n          <h1 style=\"font-family:Fraunces,serif;font-size:30px;font-weight:600;color:#2b2320;margin:0\">Syed &amp; Oliver<\u002Fh1>\n        <\u002Fdiv>\n\n        <div ref=\"{{ aboutScrollRef }}\" sc-camel-on-scroll=\"{{ onAboutScroll }}\" style=\"height:640px;overflow-y:auto;border-radius:24px;background:#fff;border:1px solid #F0E6D6;box-shadow:0 1px 3px rgba(43,35,32,0.06)\">\n          <div style=\"height:2400px\">\n            <div style=\"position:sticky;top:0;height:640px;overflow:hidden\">\n\n              <div style=\"{{ aboutCopyStyle }}\">\n                <h2 style=\"font-family:Fraunces,serif;font-size:28px;font-weight:600;color:#2b2320;margin:0 0 14px\">Built nights and weekends.<\u002Fh2>\n                <p style=\"font-family:'Nunito Sans',sans-serif;color:#6b5f58;font-size:15px;margin:0;line-height:1.6\">This platform exists because SCCSC needed a way to prove what they already knew &mdash; that the work here matters. Syed handles the build, from the database to the interface you&rsquo;re scrolling through right now. Oliver&rsquo;s in the room where it counts, turning what the org actually needs into what gets shipped. Neither of us set out to be a software shop for a nonprofit. We just kept showing up.<\u002Fp>\n              <\u002Fdiv>\n\n              <div style=\"{{ aboutCircleStyle }}\">\n                <div style=\"{{ aboutPhotoStyle }}\">\n                  <img src=\"{{ carPhotoSrc }}\" alt=\"Two cars at night, red taillights glowing\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n                <\u002Fdiv>\n                <div style=\"{{ aboutWashStyle }}\"><\u002Fdiv>\n                <div style=\"{{ aboutGlowStyle }}\"><\u002Fdiv>\n                <div style=\"{{ aboutGlyphStyle }}\">\n                  <span style=\"font-size:36px;font-weight:700;color:#fff\">中<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <p style=\"{{ aboutCaptionStyle }}\">Nights &amp; weekends &middot; the commute that built it<\u002Fp>\n\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"text-align:center;font-family:'Nunito Sans',sans-serif;font-size:11px;color:#a8998a;margin:12px 0 0\">Keep scrolling<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"{{ footerStyle }}\">{{ footerText }}<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst MOOD_DEFS = [\n  {v:1,e:'😞',t:'Rough day'},{v:2,e:'😕',t:'Not great'},{v:3,e:'😐',t:'Okay'},\n  {v:4,e:'😊',t:'Good'},{v:5,e:'😄',t:'Amazing'}\n];\nconst TAG_DEFS = ['Chinese language','Art & crafts','Homework help','New friends','STEM project','Cultural history','Sports & games'];\nconst PROGRAMS = ['Expanded Learning — After School','Mandarin Class','Cultural Arts Workshop','STEM Enrichment','Reading with Experience Corps Tutor','Youth Workforce Training'];\nconst ROSTER_NAMES = ['Mei Chen','Daniel Nguyen','Anh Tran','Wei Zhang','Sofia Ramirez','Jayden Lee','Grace Kim','Marcus Johnson'];\nconst SAMPLE_RESPONSES = [\n  {name:'Mei', emoji:'😄', note:'\"learned new characters!\"'},\n  {name:'Daniel', emoji:'🙂', note:'needs homework help'},\n  {name:'Anh', emoji:'😊', note:'felt welcome'}\n];\nconst GAUGE_DEFS = [\n  {label:'Engagement', duration:4.2, delay:0}, {label:'Attendance', duration:3.8, delay:.4},\n  {label:'Retention', duration:4.6, delay:.8}, {label:'Daily Check-ins', duration:4, delay:.2}\n];\nconst EMPTY_CARD_DEFS = [\n  {title:'Engagement Trends', tag:'Building'}, {title:'Attendance Overview', tag:'Building'},\n  {title:'Retention Cohorts', tag:'Queued'}, {title:'Program Breakdown', tag:'Queued'},\n  {title:'Funder Export', tag:'Building'}, {title:'Custom Report', tag:'Queued'}\n];\n\n// PLACEHOLDER for the real taillight photo — swap CAR_PHOTO_SRC for the\n// actual image (data URI or path) and everything else just works.\nconst CAR_PHOTO_SRC = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1600\" height=\"1000\" viewBox=\"0 0 1600 1000\"><defs><linearGradient id=\"sky\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#0a0a12\"/><stop offset=\"0.7\" stop-color=\"#12070a\"/><stop offset=\"1\" stop-color=\"#1c0708\"/><\u002FlinearGradient><filter id=\"glow\" x=\"-80%\" y=\"-80%\" width=\"260%\" height=\"260%\"><feGaussianBlur stdDeviation=\"26\"/><\u002Ffilter><filter id=\"bigglow\" x=\"-120%\" y=\"-120%\" width=\"340%\" height=\"340%\"><feGaussianBlur stdDeviation=\"60\"/><\u002Ffilter><\u002Fdefs><rect width=\"1600\" height=\"1000\" fill=\"url(#sky)\"/><rect y=\"640\" width=\"1600\" height=\"360\" fill=\"#0b0b0d\"/><path d=\"M430 640 q10 -120 120 -150 q120 -90 340 -88 q220 -2 330 92 q100 34 108 146 z\" fill=\"#101014\"/><path d=\"M560 505 q100 -70 280 -68 q180 -2 268 72 l-30 12 q-90 -60 -240 -60 q-150 0 -248 56 z\" fill=\"#1b1b22\"/><ellipse cx=\"520\" cy=\"600\" rx=\"150\" ry=\"60\" fill=\"#b3282d\" opacity=\"0.3\" filter=\"url(#bigglow)\"/><ellipse cx=\"1090\" cy=\"600\" rx=\"150\" ry=\"60\" fill=\"#b3282d\" opacity=\"0.3\" filter=\"url(#bigglow)\"/><rect x=\"452\" y=\"572\" width=\"140\" height=\"46\" rx=\"20\" fill=\"#ff2e2e\" filter=\"url(#glow)\"/><rect x=\"1016\" y=\"572\" width=\"140\" height=\"46\" rx=\"20\" fill=\"#ff2e2e\" filter=\"url(#glow)\"/><rect x=\"470\" y=\"584\" width=\"104\" height=\"22\" rx=\"11\" fill=\"#ffb3ae\"/><rect x=\"1034\" y=\"584\" width=\"104\" height=\"22\" rx=\"11\" fill=\"#ffb3ae\"/><rect x=\"472\" y=\"700\" width=\"660\" height=\"8\" rx=\"4\" fill=\"#b3282d\" opacity=\"0.35\" filter=\"url(#glow)\"/><text x=\"800\" y=\"960\" text-anchor=\"middle\" fill=\"#3a3a42\" font-family=\"monospace\" font-size=\"28\" letter-spacing=\"6\">PLACEHOLDER PHOTO<\u002Ftext><\u002Fsvg>`);\n\nconst clamp01 = v => Math.max(0, Math.min(1, v));\nconst seg = (p, a, b) => clamp01((p - a) / (b - a));\nconst easeIn = t => t * t;\nconst easeOut = t => 1 - Math.pow(1 - t, 3);\n\nclass Component extends DCLogic {\n  aboutScrollRef = React.createRef();\n\n  state = {\n    tab: 'student',\n    mood: 4, energy: 3, program: PROGRAMS[0], tags: ['Homework help'],\n    welcome: null, homework: null, checkinSubmitted: false,\n    attendance: Object.fromEntries(ROSTER_NAMES.map((n,i)=>[i, i%5!==4])),\n    attendanceSubmitted: false,\n    aboutScrollTop: 0\n  };\n\n  // Scroll-driven founders reveal, same pattern as the rest of the site:\n  // scroll position -> state -> computed styles. Three beats:\n  //   A (0-0.35): copy fades, red circle expands to cover the stage\n  //   handoff (0.38-0.5): solid red thins so the taillights glow through it\n  //   B (0.5-0.85): circle contracts to center; red dissolves into the photo\n  aboutVals(){\n    const stageH = 640, circleR = 48, settleDiam = 400;\n    const el = this.aboutScrollRef.current;\n    const w = el ? el.clientWidth : 1072;\n    const p = clamp01(this.state.aboutScrollTop / (2400 - stageH));\n\n    const cover = (Math.hypot(w / 2, stageH - 176) / circleR) * 1.05;\n    const settle = settleDiam / (circleR * 2);\n    const d = Math.hypot(w, stageH) * 1.05;           // photo apparent size at full cover\n    const layerCovered = 1 / cover;                    // keeps photo stage-locked\n    const layerFinal = (settleDiam * 1.6) / (d * settle); // full car in final circle\n\n    const a = easeIn(seg(p, 0, 0.35));\n    const b = easeOut(seg(p, 0.5, 0.85));\n    const circleScale = p < 0.5 ? 1 + (cover - 1) * a : cover + (settle - cover) * b;\n    const ty = 144 * b;                                // drift to stage center\n    const layerScale = layerCovered + (layerFinal - layerCovered) * b;\n    const copyOp = 1 - seg(p, 0, 0.28);\n    const washOp = p < 0.5 ? 1 - 0.55 * seg(p, 0.38, 0.5) : 0.45 * (1 - seg(p, 0.52, 0.8));\n    const glowOp = p < 0.5 ? seg(p, 0.38, 0.5) : 1 - 0.65 * seg(p, 0.5, 0.85);\n\n    // Full style objects: the runtime resolves whole-attribute bindings as\n    // objects, so every animated element carries its complete style here.\n    return {\n      carPhotoSrc: CAR_PHOTO_SRC,\n      aboutCopyStyle: {\n        position:'absolute', left:'50%', top:'300px', width:'100%', maxWidth:'600px', padding:'0 32px', textAlign:'center', boxSizing:'border-box',\n        opacity: copyOp, transform: `translate(-50%, ${-36 * seg(p, 0, 0.28)}px)`, pointerEvents: copyOp < 0.05 ? 'none' : 'auto'\n      },\n      aboutCircleStyle: {\n        position:'absolute', left:'50%', top:'176px', width:'96px', height:'96px', margin:'-48px 0 0 -48px', borderRadius:'50%', overflow:'hidden', background:'#b3282d', willChange:'transform',\n        transform: `translate(0px, ${ty}px) scale(${circleScale})`\n      },\n      aboutPhotoStyle: {\n        position:'absolute', left:'50%', top:'50%',\n        width: `${d}px`, height: `${d * 0.66}px`, marginLeft: `${-d / 2}px`, marginTop: `${-d * 0.33}px`, transform: `scale(${layerScale})`\n      },\n      aboutWashStyle: { position:'absolute', inset:0, background:'#b3282d', opacity: washOp },\n      aboutGlowStyle: { position:'absolute', inset:0, background:'radial-gradient(circle at 50% 55%,rgba(179,40,45,.5) 0%,rgba(142,31,35,.22) 45%,transparent 75%)', pointerEvents:'none', opacity: glowOp },\n      aboutGlyphStyle: { position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', opacity: 1 - seg(p, 0, 0.15) },\n      aboutCaptionStyle: {\n        position:'absolute', left:'50%', bottom:'36px', transform:'translateX(-50%)', fontFamily:\"'Nunito Sans',sans-serif\", fontWeight:800, fontSize:'11px', letterSpacing:'0.16em', textTransform:'uppercase', color:'#a8998a', margin:0, whiteSpace:'nowrap',\n        opacity: seg(p, 0.86, 0.96)\n      }\n    };\n  }\n\n  renderVals(){\n    const s = this.state;\n    const isAdmin = s.tab === 'admin';\n    const isStudent = s.tab === 'student';\n    const isTeacher = s.tab === 'teacher';\n    const isAbout = s.tab === 'about';\n\n    const tabDefs = [\n      {id:'student', label:'Student', glyph:'✎'},\n      {id:'teacher', label:'Teacher', glyph:'◫'},\n      {id:'about', label:'About', glyph:'☺'}\n    ];\n    const activeIdx = tabDefs.findIndex(t => t.id === s.tab);\n    const n = tabDefs.length;\n    const navItems = tabDefs.map((t) => {\n      const active = t.id === s.tab;\n      return {\n        id: t.id, label: t.label, glyph: t.glyph,\n        select: () => this.setState({tab: t.id}),\n        btnStyle: {\n          display:'flex', alignItems:'center', gap:'6px', border:'none', background:'none',\n          borderRadius:'999px', padding:'8px 14px', fontSize:'13px', fontWeight:700, cursor:'pointer',\n          whiteSpace:'nowrap', position:'relative', zIndex:1,\n          color: active ? (isAdmin ? '#0A0B0E' : '#fff') : (isAdmin ? '#8b8f98' : '#6b5f58')\n        }\n      };\n    });\n\n    const pageStyle = {\n      minHeight:'100vh',\n      background: isAdmin ? '#0a0b0e' : '#fdf9f3',\n      transition:'background-color 500ms ease',\n      fontFamily: isAdmin ? \"'Space Grotesk',sans-serif\" : \"'Nunito Sans',sans-serif\"\n    };\n    const headerStyle = {\n      position:'sticky', top:0, zIndex:50, backdropFilter:'blur(8px)',\n      background: isAdmin ? 'rgba(10,11,14,0.85)' : 'rgba(253,249,243,0.9)',\n      borderBottom: `1px solid ${isAdmin ? '#262a32' : '#EFE7DA'}`,\n      transition:'background-color 500ms ease, border-color 500ms ease'\n    };\n    const logoBoxStyle = {\n      width:'40px', height:'40px', borderRadius:'12px', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,\n      background: isAdmin ? 'linear-gradient(135deg,#1A1D23,#262A32)' : 'linear-gradient(135deg,#b3282d,#8e1f23)',\n      border: isAdmin ? '1px solid #c8a96a' : 'none'\n    };\n    const logoGlyphStyle = { fontWeight:700, fontSize:'18px', color: isAdmin ? '#c8a96a' : '#fff' };\n    const titleStyle = { fontFamily: isAdmin ? \"'Space Grotesk',sans-serif\" : \"Fraunces,serif\", fontWeight:600, fontSize:'15px', margin:0, color: isAdmin ? '#e8e6e1' : '#2b2320', whiteSpace:'nowrap' };\n    const subtitleStyle = { fontSize:'12px', margin:'2px 0 0', color: isAdmin ? '#8b8f98' : '#6b5f58' };\n    const dialTrackStyle = { position:'relative', display:'flex', background: isAdmin ? '#131519' : '#F3EBDD', border:`1px solid ${isAdmin ? '#262a32' : '#E8DCC8'}`, borderRadius:'999px', padding:'4px' };\n    const dialThumbStyle = { position:'absolute', top:'4px', bottom:'4px', left:`calc(4px + ${Math.max(activeIdx,0)} * ${100/n}%)`, width:`${100/n - 0.7}%`, borderRadius:'999px', background: isAdmin ? '#c8a96a' : '#b3282d', transition:'left 300ms ease', opacity: activeIdx>=0 ? 1 : 0 };\n    const adminLinkStyle = {\n      fontFamily:\"'Nunito Sans',sans-serif\", fontWeight:700, fontSize:'12px', cursor:'pointer', whiteSpace:'nowrap',\n      background:'none', borderRadius:'999px', padding:'8px 14px',\n      border: `1px solid ${isAdmin ? '#c8a96a' : '#E8DCC8'}`,\n      color: isAdmin ? '#c8a96a' : '#a8998a'\n    };\n\n    const moods = MOOD_DEFS.map(m => {\n      const active = s.mood === m.v;\n      return {\n        emoji: m.e, label: m.t,\n        select: () => this.setState({mood: m.v}),\n        btnStyle: { flex:1, border:'none', borderRadius:'16px', padding:'12px', display:'flex', flexDirection:'column', alignItems:'center', gap:'4px', cursor:'pointer', background: active ? '#b3282d' : '#F8F2E8', transform: active ? 'scale(1.06)' : 'none' },\n        labelStyle: { fontSize:'10px', fontWeight:700, color: active ? '#fff' : '#6b5f58' }\n      };\n    });\n    const tags = TAG_DEFS.map(tg => {\n      const active = s.tags.includes(tg);\n      return {\n        label: tg,\n        toggle: () => this.setState(st => ({tags: st.tags.includes(tg) ? st.tags.filter(x=>x!==tg) : [...st.tags, tg]})),\n        btnStyle: { border:`1.5px solid ${active ? '#d4a03c' : '#E8DCC8'}`, borderRadius:'999px', padding:'8px 14px', fontSize:'12px', fontWeight:700, cursor:'pointer', background: active ? '#d4a03c' : '#F8F2E8', color: active ? '#fff' : '#6b5f58' }\n      };\n    });\n    const yesNoStyle = (active, positive) => ({\n      flex:1, border:'none', borderRadius:'12px', padding:'12px', fontSize:'13px', fontWeight:700, cursor:'pointer',\n      background: active ? (positive ? '#4a7c59' : '#b3282d') : '#F8F2E8',\n      color: active ? '#fff' : '#6b5f58'\n    });\n\n    const luxCardStyle = { background:'#131519', border:'1px solid #262a32', borderRadius:'18px', padding:'20px' };\n    const gauges = GAUGE_DEFS.map(g => ({\n      label: g.label,\n      needleStyle: { transformOrigin:'60px 70px', animation:`needleIdle ${g.duration}s ease-in-out infinite`, animationDelay:`${g.delay}s` }\n    }));\n\n    return {\n      pageStyle, headerStyle, logoBoxStyle, logoGlyphStyle, titleStyle, subtitleStyle,\n      headerTitle: isAdmin ? 'SCCSC · Admin Dashboard' : 'Sacramento Chinese Community Service Center',\n      headerSubtitle: isAdmin ? 'Internal workspace · not yet live' : 'Serving With Heart, Growing With Purpose · Since 1978',\n      dialTrackStyle, dialThumbStyle, navItems, adminLinkStyle,\n      goAdmin: () => this.setState({tab:'admin'}),\n      isAdmin, isStudent, isTeacher, isAbout,\n      footerStyle: { textAlign:'center', padding:'24px 24px 40px', fontSize:'12px', color: isAdmin ? '#8b8f98' : '#6b5f58' },\n      footerText: isAdmin ? '◈  Admin workspace · visible to staff only' : 'Demo concept · Expanded Learning Programs · 90+ partner schools across the Sacramento region',\n\n      checkinSubmitted: s.checkinSubmitted, checkinNotSubmitted: !s.checkinSubmitted,\n      cardStyle: { background:'#fff', borderRadius:'20px', padding:'24px', boxShadow:'0 1px 3px rgba(43,35,32,0.06)', border:'1px solid #F0E6D6' },\n      cardHeadingStyle: { fontFamily:'Fraunces,serif', fontWeight:600, fontSize:'17px', color:'#2b2320', margin:'0 0 14px' },\n      moods, energy: s.energy,\n      onEnergyChange: (e) => this.setState({energy:+e.target.value}),\n      energyTrackBg: `linear-gradient(90deg,#b3282d ${(s.energy-1)/4*100}%,#E8DCC8 ${(s.energy-1)/4*100}%)`,\n      program: s.program, programOptions: PROGRAMS,\n      onProgramChange: (e) => this.setState({program:e.target.value}),\n      tags,\n      welcomeYesStyle: yesNoStyle(s.welcome===true, true), welcomeNoStyle: yesNoStyle(s.welcome===false, false),\n      setWelcomeYes: () => this.setState({welcome:true}), setWelcomeNo: () => this.setState({welcome:false}),\n      homeworkYesStyle: yesNoStyle(s.homework===true, true), homeworkNoStyle: yesNoStyle(s.homework===false, false),\n      setHomeworkYes: () => this.setState({homework:true}), setHomeworkNo: () => this.setState({homework:false}),\n      submitCheckin: () => this.setState({checkinSubmitted:true}),\n      resetCheckin: () => this.setState({checkinSubmitted:false, welcome:null, homework:null, tags:['Homework help']}),\n\n      luxCardStyle, gauges, emptyCards: EMPTY_CARD_DEFS,\n\n      aboutScrollRef: this.aboutScrollRef,\n      onAboutScroll: (e) => this.setState({aboutScrollTop: e.target.scrollTop}),\n      ...this.aboutVals(),\n\n      ...this.teacherVals()\n    };\n  }\n\n  teacherVals(){\n    const s = this.state;\n    const roster = ROSTER_NAMES.map((name,i) => {\n      const present = !!s.attendance[i];\n      return {\n        name,\n        toggle: () => this.setState(st => ({attendance: {...st.attendance, [i]: !st.attendance[i]}})),\n        rowStyle: { display:'flex', alignItems:'center', gap:'10px', width:'100%', border:'1px solid #F0E6D6', textAlign:'left', borderRadius:'12px', padding:'10px 14px', cursor:'pointer', background: present ? '#F8F2E8' : '#fff' },\n        dotStyle: { width:'10px', height:'10px', borderRadius:'50%', background: present ? '#4a7c59' : '#d0c4b4', flexShrink:0 },\n        statusStyle: { marginLeft:'auto', fontSize:'11px', fontWeight:700, color: present ? '#4a7c59' : '#a8998a' },\n        statusLabel: present ? 'Present' : 'Absent'\n      };\n    });\n    const presentCount = Object.values(s.attendance).filter(Boolean).length;\n    return {\n      roster, presentCount, totalCount: ROSTER_NAMES.length,\n      submitAttendance: () => this.setState({attendanceSubmitted:true}),\n      attendanceSubmitLabel: s.attendanceSubmitted ? 'Attendance submitted ✓' : 'Submit attendance →',\n      sampleResponses: SAMPLE_RESPONSES\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
